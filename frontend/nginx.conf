server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Os assets tem hash no nome, entao podem ser guardados indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O navegador enxerga API e interface na mesma origem, o que dispensa CORS em producao.
    location /api/ {
        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8090/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8090/v3/api-docs;
        proxy_set_header Host $host;
    }

    # Roteamento no cliente: qualquer caminho desconhecido devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
